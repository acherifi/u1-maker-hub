# U1 Maker Hub with OrcaSlicer bundled.
#   docker compose up -d      then open http://<host>:3000
# Works as-is in Portainer (Stacks → Add stack → Web editor): it pulls a prebuilt image, nothing is built.
# To build the image yourself instead: docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
# See "Docker" in the README for resource sizing.
services:
  u1-maker-hub:
    image: ghcr.io/acherifi/u1-maker-hub:latest
    platform: linux/amd64 # OrcaSlicer only ships x86_64 Linux builds
    restart: unless-stopped
    init: true # reaps the OrcaSlicer processes and forwards signals
    ports:
      - "3000:3000"
    volumes:
      - u1-data:/data
    environment:
      TZ: UTC
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3g # a large model on Fine detail peaks around 2.7 GB while slicing
        reservations:
          memory: 1g
    stop_grace_period: 30s

volumes:
  u1-data:
